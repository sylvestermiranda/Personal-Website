<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio Under Maintenance</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      height: 100vh;
      background: linear-gradient(-45deg, #1e1f26, #232526, #3a3a52, #1e1f26);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .glass {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      max-width: 600px;
      width: 100%;
      color: #ffffff;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: #ffc107;
    }

    p {
      font-size: 1.15rem;
      line-height: 1.6;
      color: #e0e0e0;
    }

    .loader {
      margin: 30px auto;
      width: 48px;
      height: 48px;
      border: 5px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffc107;
      border-radius: 50%;
      animation: spin 1s ease infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #countdown {
      margin-top: 20px;
      font-size: 1.1rem;
      color: #fff;
      font-weight: 500;
    }

    footer {
      margin-top: 30px;
      font-size: 0.85rem;
      color: #bbbbbb;
    }

    @media (max-width: 600px) {
      .glass {
        padding: 30px 20px;
      }

      h1 {
        font-size: 2rem;
      }

      p {
        font-size: 1rem;
      }

      #countdown {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="glass">
    <h1>🚧 My Portfolio is Getting an Upgrade</h1>
    <p>I'm currently working on improvements to make this site even better.<br>It'll be back online shortly — stay tuned!</p>
    <div class="loader"></div>
    <div id="countdown">Launching in: --d --h --m --s</div>
    <footer>— Sylvester Miranda • 2025</footer>
  </div>

  <script>
    const countdownEl = document.getElementById("countdown");

    const launchDate = new Date("2025-07-16T10:00:00").getTime(); // Change to your desired launch date/time

    const updateCountdown = () => {
      const now = new Date().getTime();
      const distance = launchDate - now;

      if (distance < 0) {
        countdownEl.innerHTML = "We're back online! 🎉";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      countdownEl.innerHTML = `Launching in: ${days}d ${hours}h ${minutes}m ${seconds}s`;
    };

    updateCountdown();  
    setInterval(updateCountdown, 1000);  
  </script>
</body>
</html>
